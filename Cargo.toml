[workspace]
resolver = "2"
members = [
    "crates/desktop-ui",
    "crates/explorer-bridge",
    "crates/platform-win",
    "crates/settings-store",
    "crates/shell-core",
    "crates/superdesktop-app",
    "crates/superdesktop-guardian",
    "crates/superdesktop-test-support",
    "crates/taskbar-ui",
]

[workspace.package]
edition = "2024"
rust-version = "1.97"
version = "0.1.0"
license = "MIT OR Apache-2.0"
authors = ["SuperDesktop contributors"]
repository = "https://github.com/damody/SuperDesktop"

[workspace.dependencies]
gpui = { git = "https://github.com/damody/gpui-ce-explorer.git", rev = "8945e2981b9fd00ca887e042d8adb9acc241b168", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
