[workspace]
resolver = "2"
members = [
    "crates/desktop-ui",
    "crates/explorer-bridge",
    "crates/platform-win",
    "crates/settings-store",
    "crates/shell-core",
    "crates/superdesktop-app",
    "crates/superdesktop-guardian",
    "crates/superdesktop-test-support",
    "crates/taskbar-ui",
]

[workspace.package]
edition = "2024"
rust-version = "1.97"
version = "0.1.0"
license = "MIT OR Apache-2.0"
authors = ["SuperDesktop contributors"]
repository = "https://github.com/damody/SuperDesktop"

[workspace.dependencies]
gpui = { git = "https://github.com/damody/gpui-ce-explorer.git", rev = "8945e2981b9fd00ca887e042d8adb9acc241b168", default-features = false, features = ["windows-manifest"] }
gpui_windows = { git = "https://github.com/damody/gpui-ce-explorer.git", rev = "8945e2981b9fd00ca887e042d8adb9acc241b168", default-features = false }
jsonschema = { version = "=0.37.1", default-features = false }
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_Console", "Win32_System_SystemInformation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_Graphics_Gdi"] }
raw-window-handle = "=0.6.2"
serde_json = "=1.0.151"

[workspace.lints.rust]
unsafe_code = "deny"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
