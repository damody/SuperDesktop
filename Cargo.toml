[workspace]
resolver = "2"
members = [
    "crates/desktop-ui",
    "crates/explorer-bridge",
    "crates/notification-area-host",
    "crates/platform-win",
    "crates/settings-store",
    "crates/shell-core",
    "crates/shell-provider-host",
    "crates/shell-provider-protocol",
    "crates/shell-installer",
    "crates/superdesktop-app",
    "crates/superdesktop-guardian",
    "crates/superdesktop-test-support",
    "crates/system-status-host",
    "crates/taskbar-state-host",
    "crates/taskbar-ui",
]

[workspace.package]
edition = "2024"
rust-version = "1.97"
version = "0.1.0"
license = "MIT OR Apache-2.0"
authors = ["SuperDesktop contributors"]
repository = "https://github.com/damody/SuperDesktop"

[workspace.dependencies]
gpui = { git = "https://github.com/damody/gpui-ce-explorer.git", rev = "54f1339ef1791cf1d1a281ff7fa37d7e0d6b8436", default-features = false, features = ["windows-manifest"] }
gpui_windows = { git = "https://github.com/damody/gpui-ce-explorer.git", rev = "54f1339ef1791cf1d1a281ff7fa37d7e0d6b8436", default-features = false }
jsonschema = { version = "=0.37.1", default-features = false }
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_DataExchange", "Win32_System_Variant", "Win32_System_Power", "Win32_System_Time", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_Console", "Win32_System_SystemInformation", "Win32_System_Shutdown", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_Networking_NetworkListManager", "Win32_Security", "Win32_Storage_FileSystem", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm"] }
raw-window-handle = "=0.6.2"
serde_json = "=1.0.151"
serde = { version = "=1.0.229", features = ["derive"] }
image = { version = "=0.25.10", default-features = false }
intel_tex_2 = "=0.5.0"

[workspace.lints.rust]
unsafe_code = "deny"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
