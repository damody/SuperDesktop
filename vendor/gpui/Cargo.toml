[package]
edition = "2024"
name = "gpui"
version = "0.2.2"
authors = ["Nathan Sobo <nathan@zed.dev>"]
build = "build.rs"
publish = true
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Zed's GPU-accelerated UI framework"
homepage = "https://gpui.rs"
readme = "README.md"
keywords = [
    "desktop",
    "gui",
    "immediate",
]
categories = ["gui"]
license = "Apache-2.0"
repository = "https://github.com/zed-industries/zed"

[features]
default = [
    "font-kit",
    "wayland",
    "x11",
    "windows-manifest",
]
input-latency-histogram = ["dep:hdrhistogram"]
inspector = ["gpui_macros/inspector"]
leak-detection = ["backtrace"]
screen-capture = ["scap"]
test-support = [
    "leak-detection",
    "collections/test-support",
    "wayland",
    "x11",
    "proptest",
]
wayland = ["bitflags"]
windows-manifest = ["dep:embed-resource"]
x11 = ["scap?/x11"]

[lib]
